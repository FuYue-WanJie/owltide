# Secret scan: run scripts/secretscan over the commits a push or PR
# would introduce. Rules + pinned hashes only — no keys in secrets,
# no OWLTIDE_API_KEY in CI.
name: secretscan

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history so ranges resolve

      - name: Determine scan range
        id: range
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
            HEAD="${{ github.event.pull_request.head.sha }}"
            git fetch -q origin "$BASE" || true
            echo "range=$BASE..$HEAD" >> "$GITHUB_OUTPUT"
          else
            BEFORE="${{ github.event.before }}"
            AFTER="${{ github.sha }}"
            if git cat-file -e "$BEFORE" 2>/dev/null; then
              echo "range=$BEFORE..$AFTER" >> "$GITHUB_OUTPUT"
            else
              # New branch: scan everything reachable from the tip.
              echo "range=$AFTER" >> "$GITHUB_OUTPUT"
            fi
          fi

      - name: Scan
        run: |
          chmod +x scripts/secretscan
          ./scripts/secretscan "${{ steps.range.outputs.range }}"
