# Secret scan: run scripts/secretscan over the commits a push or PR
# would introduce. Rules + pinned hashes only — no keys in secrets,
# no OWLTIDE_API_KEY in CI.
name: secretscan

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history so ranges resolve

      - name: Scan
        run: |
          chmod +x scripts/secretscan
          # PR: scan the commits the PR introduces.
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
            HEADSHA="${{ github.event.pull_request.head.sha }}"
            git fetch -q origin "$BASE" || true
            ./scripts/secretscan "$BASE..$HEADSHA"
            exit $?
          fi
          # Push: scan only commits the remote does not have yet, so a
          # new branch or force push is judged on ITS new commits, not
          # on historical leaks the scanner pinned earlier.
          AFTER="${{ github.sha }}"
          ./scripts/secretscan "$AFTER" --not --remotes
