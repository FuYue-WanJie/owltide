# Secret scan: run scripts/secretscan over the commits a push or PR
# would introduce. Rules + pinned hashes only — no keys in secrets,
# no OWLTIDE_API_KEY in CI.
name: secretscan

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history so ranges resolve

      - name: Scan (push)
        if: github.event_name == 'push'
        run: |
          chmod +x scripts/secretscan
          BEFORE="${{ github.event.before }}"
          AFTER="${{ github.sha }}"
          if [ "$BEFORE" != "0000000000000000000000000000000000000000" ] \
             && git cat-file -e "$BEFORE" 2>/dev/null; then
            # Normal push: exactly the commits this push introduces.
            ./scripts/secretscan "$BEFORE..$AFTER"
          else
            # New branch or force push with unreachable before: scan
            # commits reachable from the tip that NO remote ref has.
            # --remotes/origin/* already contains the pushed branch
            # after checkout, so it is excluded explicitly.
            git branch -r | grep -v "origin/$GITHUB_REF_NAME" > /tmp/remotes.txt || true
            EXCLUDE=""
            while IFS= read -r ref; do
              [ -n "$ref" ] || continue
              EXCLUDE="$EXCLUDE --not $ref"
            done < /tmp/remotes.txt
            # shellcheck disable=SC2086
            ./scripts/secretscan "$AFTER" $EXCLUDE
          fi

      - name: Canary (scanner must actually fire)
        run: |
          chmod +x scripts/secretscan
          # The historical leak commit must be BLOCKED. If the scanner
          # silently scans an empty range, this step fails the build.
          if ./scripts/secretscan "e57a1aa~1..e57a1aa"; then
            echo "::error::secretscan canary did NOT block the pinned leak commit — scanner is not working"
            exit 1
          fi

      - name: Warn on suspiciously empty push scan
        if: github.event_name == 'push' && github.event.before != '0000000000000000000000000000000000000000' && github.event.before != github.sha
        run: |
          BEFORE="${{ github.event.before }}"
          AFTER="${{ github.sha }}"
          N=$(git rev-list --count "$BEFORE..$AFTER" 2>/dev/null || echo -1)
          echo "push range $BEFORE..$AFTER contains $N commit(s)"
          if [ "$N" = 0 ] || [ "$N" = -1 ]; then
            echo "::warning::push scan saw an EMPTY range — verify the scan step actually scanned something"
          fi
