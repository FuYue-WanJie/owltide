<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>OwlTide</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 720px; margin: 40px auto; padding: 0 16px; color: #222; }
  h1 { font-size: 1.4rem; } code { background: #f4f4f4; padding: 2px 5px; border-radius: 4px; }
  li { margin: 4px 0; }
</style>
</head>
<body>
<h1>OwlTide — 只读 API 已就绪</h1>
<p>占位页（界面设计确定后替换）。当前可用接口：</p>
<ul>
  <li><code>GET /api/sessions</code> — 会话列表</li>
  <li><code>GET /api/sessions/{id}</code> — 某会话消息</li>
  <li><code>GET /api/subagents</code> — 子代理状态</li>
  <li><code>GET /api/jobs</code> — 后台作业状态</li>
  <li><code>GET /api/events</code> — SSE 事件流（新消息 / 状态变化）</li>
</ul>
</body>
</html>
